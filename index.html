<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX RUSH - Drift Master</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a0a0f;overflow:hidden;color:white;font-family:Arial}
#gameWrap{position:relative;width:100vw;height:100vh;max-width:500px;margin:auto;background:#111}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;font-weight:bold;z-index:10}
#startScreen,#overScreen{position:absolute;inset:0;background:rgba(5,5,10,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;text-align:center}
#overScreen{display:none}
h1{font-size:40px;background:linear-gradient(90deg,#00f5ff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:16px 40px;background:linear-gradient(90deg,#00f5ff,#7a00ff);border:none;border-radius:30px;color:white;font-size:18px;font-weight:bold;margin:8px}
#adBox{width:90%;height:90px;background:#1a1a2e;border:1px dashed #555;display:flex;align-items:center;justify-content:center;margin:15px;border-radius:10px;color:#888;font-size:12px}
#controls{position:absolute;bottom:0;left:0;width:100%;display:flex;z-index:10;height:35%}
.ctrl{flex:1;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:0.2}
#nitro{position:absolute;right:15px;bottom:38%;z-index:11;width:70px;height:70px;border-radius:50%;background:radial-gradient(#ff3c00,#ff8c00);border:3px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="game"></canvas>
<div id="ui"><div id="score">SCORE: 0</div><div id="coins">COINS: 0</div></div>
<div id="startScreen"><h1>APEX RUSH</h1><p>Collect coins, avoid cars!<br>Left/Right = Steer, NITRO = Boost</p><button class="btn" onclick="startGame()">START RUSH</button></div>
<div id="overScreen"><h1>WRECKED!</h1><div id="finalScore" style="font-size:24px;margin:10px"></div><div id="adBox">AD SPACE - Yaha Ad se Paisa Aayega</div><button class="btn" onclick="startGame()">RETRY</button><button class="btn" style="background:#333" onclick="revive()">WATCH AD TO REVIVE</button></div>
<div id="controls"><div class="ctrl" id="l">◀</div><div class="ctrl" id="r">▶</div></div><div id="nitro">NITRO</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,player,keys={},score=0,coins=0,running=false,speed=6,ents=[],t1=0,t2=0,high=localStorage.getItem('apexHigh')||0,ac;
function resize(){W=canvas.width=canvas.offsetWidth*2;H=canvas.height=canvas.offsetHeight*2;}
resize(); window.addEventListener('resize',resize);
function tone(f,d){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=0.2;o.start();g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.stop(ac.currentTime+d);}
function startGame(){document.getElementById('startScreen').style.display='none';document.getElementById('overScreen').style.display='none';player={x:W/2-40,y:H-300,w:80,h:140};ents=[];score=0;speed=6;t1=0;t2=0;running=true;coins=parseInt(localStorage.getItem('apexCoins')||0);loop();tone(440,0.3);}
function spawnE(){const lw=W/3,l=Math.floor(Math.random()*3);ents.push({t:'e',x:l*lw+lw*0.15,y:-200,w:lw*0.7,h:130,c:`hsl(${200+Math.random()*60},100%,60%)`});}
function spawnC(){const lw=W/3,l=Math.floor(Math.random()*3);ents.push({t:'c',x:l*lw+lw*0.4,y:-100,w:40,h:40});}
function loop(){if(!running)return;requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);ctx.fillStyle='#222';ctx.fillRect(W*0.05,0,W*0.9,H);ctx.fillStyle='#333';for(let i=0;i<H;i+=80){ctx.fillRect(W*0.33,i+Date.now()*0.5%80,10,40);ctx.fillRect(W*0.66,i+Date.now()*0.5%80,10,40);}
if(keys.left||keys.ArrowLeft||keys.a)player.x-=18;if(keys.right||keys.ArrowRight||keys.d)player.x+=18;player.x=Math.max(W*0.05,Math.min(W*0.95-player.w,player.x));
t1++;t2++;if(t1>60-Math.min(40,score/20)){spawnE();t1=0;}if(t2>40){spawnC();t2=0;}
for(let i=ents.length-1;i>=0;i--){let e=ents[i];e.y+=speed;if(e.t=='e'){ctx.fillStyle=e.c;ctx.fillRect(e.x,e.y,e.w,e.h);if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){gameOver();return;}}else{ctx.beginPath();ctx.arc(e.x+20,e.y+20,18,0,Math.PI*2);ctx.fillStyle='#FFD700';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();if(player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){coins++;score+=20;ents.splice(i,1);tone(800,0.2);localStorage.setItem('apexCoins',coins);continue;}}if(e.y>H){ents.splice(i,1);if(e.t=='e')score+=10;}}
ctx.fillStyle='#00f5ff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#fff';ctx.fillRect(player.x+10,player.y+10,player.w-20,20);
score+=0.2;speed+=0.002;document.getElementById('score').textContent='SCORE: '+Math.floor(score)+' | BEST: '+Math.floor(Math.max(score,high));document.getElementById('coins').textContent='COINS: '+coins;
}
function gameOver(){running=false;if(score>high){high=score;localStorage.setItem('apexHigh',high);}document.getElementById('finalScore').textContent='Score: '+Math.floor(score)+' | Best: '+Math.floor(high);document.getElementById('overScreen').style.display='flex';tone(150,0.8);}
function revive(){document.getElementById('overScreen').style.display='none';ents=ents.filter(e=>e.y>H-500);running=true;loop();}
function k(v,s){keys[v]=s;}
window.addEventListener('keydown',e=>k(e.key,true));window.addEventListener('keyup',e=>k(e.key,false));
l.addEventListener('touchstart',()=>k('left',true));l.addEventListener('touchend',()=>k('left',false));
r.addEventListener('touchstart',()=>k('right',true));r.addEventListener('touchend',()=>k('right',false));
nitro.addEventListener('touchstart',()=>{speed=13;});nitro.addEventListener('touchend',()=>{speed=6;});
</script>
</body>
</html>
